<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Text Scroller</title>
<style>
  :root {
    --bg: #000;
    --fg: #fff;
    --panel: rgba(20, 20, 24, 0.94);
    --panel-fg: #e8e8ea;
    --muted: #9a9aa2;
    --accent: #e0b25c;
    --border: rgba(255, 255, 255, 0.12);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--bg);
    color: var(--fg);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    overflow: hidden;
  }

  #stage {
    position: fixed; inset: 0;
    overflow: hidden;
    cursor: default;
  }
  #stage.hide-cursor { cursor: none; }
  #text {
    position: absolute; left: 50%; top: 0;
    transform: translate(-50%, 100vh);
    white-space: pre-wrap;
    word-wrap: break-word;
    will-change: transform;
    transition: left .25s;
  }
  /* While the panel is open, center the text in the space left of it */
  body.panel-open #text { left: calc(50vw - 196px); }

  #panel {
    position: fixed; top: 16px; right: 16px;
    width: min(360px, calc(100vw - 32px));
    max-height: calc(100vh - 32px);
    overflow-y: auto;
    background: var(--panel);
    color: var(--panel-fg);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 16px;
    font-size: 13px;
    z-index: 10;
    transition: opacity .2s, transform .2s;
  }
  #panel.hidden { opacity: 0; transform: translateX(20px); pointer-events: none; }
  #panel h1 { font-size: 15px; margin: 0 0 12px; font-weight: 600; }
  textarea {
    width: 100%; height: 140px; resize: vertical;
    background: #0d0d10; color: var(--panel-fg);
    border: 1px solid var(--border); border-radius: 8px;
    padding: 8px; font: inherit; font-size: 13px;
  }
  .row { margin-top: 12px; }
  .row label { display: flex; justify-content: space-between; color: var(--muted); margin-bottom: 4px; }
  .row label b { color: var(--panel-fg); font-weight: 500; font-variant-numeric: tabular-nums; }
  input[type=range] { width: 100%; accent-color: var(--accent); }
  .inline { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  select, input[type=color] {
    background: #0d0d10; color: var(--panel-fg);
    border: 1px solid var(--border); border-radius: 6px; padding: 4px 6px; font: inherit;
  }
  input[type=color] { width: 36px; height: 28px; padding: 2px; }
  .buttons { display: flex; gap: 8px; margin-top: 14px; flex-wrap: wrap; }
  button {
    flex: 1; min-width: 80px;
    background: #2a2a30; color: var(--panel-fg);
    border: 1px solid var(--border); border-radius: 8px;
    padding: 8px 10px; font: inherit; cursor: pointer;
  }
  button:hover { background: #34343c; }
  button.primary { background: var(--accent); color: #1a1408; border-color: transparent; font-weight: 600; }
  button.primary:hover { filter: brightness(1.08); }
  .hint { margin-top: 12px; color: var(--muted); font-size: 12px; line-height: 1.6; }
  kbd {
    background: #2a2a30; border: 1px solid var(--border); border-radius: 4px;
    padding: 0 5px; font-size: 11px; font-family: inherit;
  }
  #progress {
    position: fixed; left: 0; bottom: 0; height: 2px;
    background: var(--accent); width: 0; z-index: 5; opacity: .6;
  }
  #progress.hidden { display: none; }
</style>
</head>
<body>
<div id="stage"><div id="text"></div></div>
<div id="progress"></div>

<div id="panel">
  <h1>Text Scroller</h1>
  <textarea id="input" placeholder="Paste văn bản vào đây..."></textarea>

  <div class="row">
    <label>Tốc độ <b><span id="speedVal"></span> px/s</b></label>
    <input id="speed" type="range" min="5" max="400" step="1">
  </div>
  <div class="row">
    <label>Cỡ chữ <b><span id="sizeVal"></span> px</b></label>
    <input id="size" type="range" min="12" max="160" step="1">
  </div>
  <div class="row">
    <label>Độ rộng đoạn văn <b><span id="widthVal"></span> %</b></label>
    <input id="width" type="range" min="10" max="100" step="1">
  </div>
  <div class="row">
    <label>Giãn dòng <b><span id="lineVal"></span></b></label>
    <input id="line" type="range" min="1" max="3" step="0.05">
  </div>

  <div class="row inline">
    <select id="align" title="Căn lề">
      <option value="center">Căn giữa</option>
      <option value="left">Căn trái</option>
      <option value="right">Căn phải</option>
      <option value="justify">Căn đều</option>
    </select>
    <select id="font" title="Font">
      <option value="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">Sans</option>
      <option value="Georgia, 'Times New Roman', serif">Serif</option>
      <option value="ui-monospace, Menlo, Consolas, monospace">Mono</option>
    </select>
    <label class="inline" title="Màu chữ">Chữ <input id="fg" type="color"></label>
    <label class="inline" title="Màu nền">Nền <input id="bg" type="color"></label>
  </div>

  <div class="row inline">
    <label class="inline"><input id="loop" type="checkbox"> Lặp lại khi hết</label>
  </div>

  <div class="buttons">
    <button id="play" class="primary">▶ Chạy</button>
    <button id="reset">↺ Về đầu</button>
    <button id="full">⛶ Toàn màn hình</button>
  </div>

  <div class="hint">
    <kbd>Space</kbd> chạy/dừng · <kbd>R</kbd> về đầu · <kbd>H</kbd> ẩn/hiện bảng ·
    <kbd>F</kbd> toàn màn hình · <kbd>↑</kbd><kbd>↓</kbd> tốc độ ·
    <kbd>+</kbd><kbd>−</kbd> cỡ chữ · <kbd>←</kbd><kbd>→</kbd> tua · cuộn chuột để tua
  </div>
</div>

<script>
(() => {
  const $ = id => document.getElementById(id);
  const stage = $('stage'), text = $('text'), panel = $('panel'), progress = $('progress');
  const input = $('input');

  const defaults = {
    text: "SHARDS OF MEMORY\n\n\nĐạo diễn\nTên người\n\nBiên kịch\nTên người\n\n\nPaste văn bản của bạn vào ô bên phải...",
    speed: 60, size: 40, width: 60, line: 1.5,
    align: 'center', font: defaults_font(), fg: '#ffffff', bg: '#000000', loop: false,
  };
  function defaults_font() { return "system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"; }

  const KEY = 'text-scroller-settings';
  let s = { ...defaults };
  try { Object.assign(s, JSON.parse(localStorage.getItem(KEY) || '{}')); } catch (e) {}
  const save = () => { try { localStorage.setItem(KEY, JSON.stringify(s)); } catch (e) {} };

  // offset = how far the text has moved up from its start position (bottom of screen)
  let offset = 0, playing = false, last = null;

  const startY = () => window.innerHeight;
  const endOffset = () => window.innerHeight + text.offsetHeight;

  function render() {
    text.style.transform = `translate(-50%, ${startY() - offset}px)`;
    const p = Math.min(1, Math.max(0, offset / endOffset()));
    progress.style.width = (p * 100) + '%';
  }

  function apply() {
    text.textContent = s.text;
    text.style.fontSize = s.size + 'px';
    text.style.width = s.width + 'vw';
    text.style.lineHeight = s.line;
    text.style.textAlign = s.align;
    text.style.fontFamily = s.font;
    text.style.color = s.fg;
    document.body.style.background = s.bg;
    $('speedVal').textContent = s.speed;
    $('sizeVal').textContent = s.size;
    $('widthVal').textContent = s.width;
    $('lineVal').textContent = Number(s.line).toFixed(2);
    render();
    save();
  }

  function syncControls() {
    input.value = s.text;
    $('speed').value = s.speed; $('size').value = s.size;
    $('width').value = s.width; $('line').value = s.line;
    $('align').value = s.align; $('font').value = s.font;
    $('fg').value = s.fg; $('bg').value = s.bg; $('loop').checked = s.loop;
  }

  function tick(t) {
    if (!playing) { last = null; return; }
    if (last !== null) {
      offset += s.speed * (t - last) / 1000;
      if (offset >= endOffset()) {
        if (s.loop) offset = 0;
        else { offset = endOffset(); setPlaying(false); }
      }
      render();
    }
    last = t;
    requestAnimationFrame(tick);
  }

  function setPlaying(v) {
    playing = v;
    $('play').textContent = v ? '❚❚ Dừng' : '▶ Chạy';
    stage.classList.toggle('hide-cursor', v);
    if (v) {
      if (offset >= endOffset()) offset = 0;
      requestAnimationFrame(tick);
    }
  }

  function reset() { offset = 0; render(); }
  function seek(d) { offset = Math.min(endOffset(), Math.max(0, offset + d)); render(); }
  function togglePanel() {
    panel.classList.toggle('hidden');
    document.body.classList.toggle('panel-open', !panel.classList.contains('hidden'));
  }
  function toggleFull() {
    if (!document.fullscreenElement) document.documentElement.requestFullscreen?.();
    else document.exitFullscreen?.();
  }

  // Controls
  input.addEventListener('input', () => { s.text = input.value; apply(); });
  const num = (id, key) => $(id).addEventListener('input', e => { s[key] = Number(e.target.value); apply(); });
  num('speed', 'speed'); num('size', 'size'); num('width', 'width'); num('line', 'line');
  const str = (id, key) => $(id).addEventListener('input', e => { s[key] = e.target.value; apply(); });
  str('align', 'align'); str('font', 'font'); str('fg', 'fg'); str('bg', 'bg');
  $('loop').addEventListener('change', e => { s.loop = e.target.checked; save(); });
  $('play').addEventListener('click', () => setPlaying(!playing));
  $('reset').addEventListener('click', reset);
  $('full').addEventListener('click', toggleFull);

  // Paste anywhere on the stage replaces the text
  document.addEventListener('paste', e => {
    if (e.target === input) return;
    const t = e.clipboardData?.getData('text');
    if (t) { e.preventDefault(); s.text = t; input.value = t; reset(); apply(); }
  });

  stage.addEventListener('wheel', e => { e.preventDefault(); seek(e.deltaY); }, { passive: false });
  stage.addEventListener('dblclick', togglePanel);

  document.addEventListener('keydown', e => {
    if (e.target === input || e.target.tagName === 'SELECT') {
      if (e.key === 'Escape') input.blur();
      return;
    }
    const step = (key, d, min, max, id) => {
      s[key] = Math.min(max, Math.max(min, s[key] + d)); $(id).value = s[key]; apply();
    };
    switch (e.key) {
      case ' ': e.preventDefault(); setPlaying(!playing); break;
      case 'r': case 'R': reset(); break;
      case 'h': case 'H': togglePanel(); break;
      case 'f': case 'F': toggleFull(); break;
      case 'p': case 'P': progress.classList.toggle('hidden'); break;
      case 'ArrowUp': e.preventDefault(); step('speed', 5, 5, 400, 'speed'); break;
      case 'ArrowDown': e.preventDefault(); step('speed', -5, 5, 400, 'speed'); break;
      case '+': case '=': step('size', 2, 12, 160, 'size'); break;
      case '-': case '_': step('size', -2, 12, 160, 'size'); break;
      case 'ArrowRight': seek(100); break;
      case 'ArrowLeft': seek(-100); break;
    }
  });

  window.addEventListener('resize', render);

  document.body.classList.add('panel-open');
  syncControls();
  apply();
})();
</script>
</body>
</html>
